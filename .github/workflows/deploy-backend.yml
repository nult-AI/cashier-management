name: Deploy Backend to Azure Container Apps

on:
  push:
    branches: [ deploy_azure ]
    # 🔥 QUAN TRỌNG: Chỉ kích hoạt pipeline khi có thay đổi trong thư mục backend hoặc chính file workflow này
    paths:
      - 'backend/**' 
      - '.github/workflows/deploy-backend.yml'
  # Cho phép kích hoạt chạy pipeline bằng tay từ giao diện GitHub
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - uses: actions/checkout@v3

      # Thiết lập Docker Buildx để tối ưu hóa caching khi build Docker image
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # 1. Đăng nhập vào Azure bằng Service Principal
      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 2. Đăng nhập vào Azure Container Registry (ACR)
      - name: Log in to ACR
        run: |
          az acr login --name acrnultcashiertest

      # 3. Build & Push Docker Image sử dụng setup-buildx cache
      - name: Build and push image to ACR
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: acrnultcashiertest.azurecr.io/nult-cashier-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 4. Cập nhật Image mới lên Azure Container App
      - name: Deploy to Container App
        uses: azure/container-apps-deploy-action@v1
        with:
          acrName: acrnultcashiertest
          containerAppName: ca-nult-cashier-backend
          resourceGroup: rg-nult-cashier-test
          imageToDeploy: acrnultcashiertest.azurecr.io/nult-cashier-backend:${{ github.sha }}